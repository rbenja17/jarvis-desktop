name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows packages
        shell: pwsh
        run: .\packaging\build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Jarvis\Jarvis.exe")) { throw "Missing Jarvis.exe" }
          if (-not (Test-Path "dist\installer\JarvisSetup-${{ steps.ver.outputs.version }}.exe")) { throw "Missing installer" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/JarvisSetup-*.exe
            dist/Jarvis-*-portable.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/JarvisSetup-*.exe
            dist/Jarvis-*-portable.zip
